services:
  - type: web
    name: invex-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://invex-frontend.onrender.com,https://invex-sistema.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: invex-db
          property: connectionString
    autoDeploy: true

  - type: web
    name: invex-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm install -g serve && serve -s build -l $PORT
    envVars:
      - key: REACT_APP_API_URL
        value: https://invex-backend.onrender.com
    autoDeploy: true

databases:
  - name: invex-db
    databaseName: invex
    user: invex_user
