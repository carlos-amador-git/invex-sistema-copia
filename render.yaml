services:
  - type: web
    name: invex-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_xb9VsfIJnT0p@ep-hidden-glitter-adojmeql-pooler.c-2.us-east-1.aws.neon.tech/invex_sistema?sslmode=require"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://invex-sistema.vercel.app,https://*.vercel.app"
      - key: VERCEL_ENV
        value: "production"
