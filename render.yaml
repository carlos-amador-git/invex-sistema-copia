services:
  # Backend: FastAPI Web Service
  - type: web
    name: invex-backend
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: invex-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://invex-sistema.onrender.com"

  # Frontend: React Static Site
  - type: static
    name: invex-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    publishDir: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: invex-backend
          property: url

databases:
  - name: invex-db
    region: oregon
    plan: free
    databaseName: invex
    user: invex_user
